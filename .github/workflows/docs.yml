name: Docs

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify GitHub Pages configuration
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/tmp/pages-error)"; then
            echo "::error::GitHub Pages is not enabled for ${GITHUB_REPOSITORY}. Configure Settings -> Pages -> Source: GitHub Actions, or run: gh api --method POST repos/${GITHUB_REPOSITORY}/pages -f build_type=workflow"
            cat /tmp/pages-error
            exit 1
          fi

          if [ "${build_type}" != "workflow" ]; then
            echo "::error::GitHub Pages build_type is '${build_type}', expected 'workflow'. Configure Settings -> Pages -> Source: GitHub Actions."
            exit 1
          fi

      - name: Configure GitHub Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # ratchet:actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check DID surface discipline
        run: pnpm run check:did-surface-discipline

      - name: Build docs site
        run: ./run.sh docs

      - name: Upload Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # ratchet:actions/upload-pages-artifact@v4
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: Deploy Docs Site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # ratchet:actions/deploy-pages@v4

      - name: Smoke test published site
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for path in "" "guide/" "api/" "spec/midnight-method.html"; do
            url="${PAGES_URL%/}/${path}"
            curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "${url}" >/dev/null
          done
