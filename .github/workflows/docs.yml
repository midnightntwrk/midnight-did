name: Docs

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs Site
    # pages: read for the Pages-config probe on develop pushes
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          github-token: ${{ github.token }}
          install: "false"

      - name: Verify GitHub Pages configuration
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/tmp/pages-error)"; then
            echo "::error::GitHub Pages is not enabled for ${GITHUB_REPOSITORY}. Configure Settings -> Pages -> Source: GitHub Actions, or run: gh api --method POST repos/${GITHUB_REPOSITORY}/pages -f build_type=workflow"
            cat /tmp/pages-error
            exit 1
          fi

          if [ "${build_type}" != "workflow" ]; then
            echo "::error::GitHub Pages build_type is '${build_type}', expected 'workflow'. Configure Settings -> Pages -> Source: GitHub Actions."
            exit 1
          fi

      - name: Configure GitHub Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # ratchet:actions/configure-pages@v6.0.0

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: Install docs browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Check DID surface discipline
        run: pnpm run check:did-surface-discipline

      - name: Validate docs
        run: pnpm run docs:validate

      - name: Build docs site
        run: ./run.sh docs

      - name: Upload docs visual artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: docs-visual-${{ github.sha }}
          path: test-results/docs-visual/
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # ratchet:actions/upload-pages-artifact@v5.0.0
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: Deploy Docs Site
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # ratchet:actions/deploy-pages@v5.0.0

      - name: Smoke test published site
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for path in "" "guide/" "api/" "spec/midnight-method.html"; do
            url="${PAGES_URL%/}/${path}"
            curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "${url}" >/dev/null
          done
