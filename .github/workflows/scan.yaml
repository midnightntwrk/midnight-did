name: Scan
permissions: {}

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}   # so you can still run it manually
  schedule:
    - cron: '0 0 * * *'   # run daily at midnight UTC
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  #v6.1.0
        with:
          persist-credentials: false

      - name: Scan code
        uses: midnightntwrk/upload-sarif-github-action@6e93ae0ea1494d29b521a2c8bbfa068375bf7a26  # main 2026-07-10, includes #113 scan-context fix
        with:
          fail_severity: "high"
          skip_scorecard_scan: "true"
