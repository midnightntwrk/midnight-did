name: Publish npmjs Packages and ZK Artifacts

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      channel:
        description: "Publication channel"
        required: true
        type: choice
        default: rc
        options:
          - snapshot
          - rc
          - release
      version:
        description: "Base semantic version, for example 0.4.0. Defaults to package.json version."
        required: false
        type: string
      rc_index:
        description: "Positive integer used for rc versions, for example 1 creates x.y.z-rc1."
        required: false
        type: string

permissions:
  contents: read

env:
  COMPACT_COMPILER_VERSION: 0.30.0
  NPM_REGISTRY: https://registry.npmjs.org/
  ORAS_VERSION: 1.2.3
  PNPM_CONFIG_AUDIT: "false"
  PNPM_CONFIG_FUND: "false"

concurrency:
  group: did-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Classify snapshot release changes
    runs-on: ubuntu-latest
    outputs:
      changed_file_count: ${{ steps.classify.outputs.changed_file_count }}
      snapshot_release_relevant: ${{ steps.classify.outputs.snapshot_release_relevant }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-change-classifier.mjs --output "$GITHUB_OUTPUT"

      - name: Print snapshot release classification
        env:
          CHANGED_FILE_COUNT: ${{ steps.classify.outputs.changed_file_count }}
          SNAPSHOT_RELEASE_RELEVANT: ${{ steps.classify.outputs.snapshot_release_relevant }}
        run: |
          echo "snapshot_release_relevant=${SNAPSHOT_RELEASE_RELEVANT}"
          echo "changed_file_count=${CHANGED_FILE_COUNT}"

  skip-snapshot:
    name: Skip snapshot publication
    runs-on: ubuntu-latest
    needs:
      - changes
    if: github.event_name == 'push' && (github.ref != 'refs/heads/develop' || needs.changes.outputs.snapshot_release_relevant != 'true')
    steps:
      - name: Report skipped snapshot
        env:
          REF_NAME: ${{ github.ref_name }}
          CHANGED_FILE_COUNT: ${{ needs.changes.outputs.changed_file_count }}
        run: |
          echo "Skipping automated snapshot publication."
          echo "Branch: $REF_NAME"
          echo "Changed files: $CHANGED_FILE_COUNT"
          echo "Snapshot publication is reserved for develop pushes with Compact, TypeScript, JavaScript, or script changes."

  publish:
    name: Publish packages and ZK artifacts
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    outputs:
      base64_subjects: ${{ steps.provenance-subjects.outputs.base64_subjects }}
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      provenance_present: ${{ steps.release-state.outputs.provenance_present }}
      release_exists: ${{ steps.release-state.outputs.release_exists }}
    needs:
      - changes
    if: github.event_name != 'push' || (github.ref == 'refs/heads/develop' && needs.changes.outputs.snapshot_release_relevant == 'true')
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve publication context
        id: context
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_RC_INDEX: ${{ inputs.rc_index }}
        run: ./scripts/release-resolve-context.sh

      - name: Set up Node.js, pnpm, Compact, and npm registry
        uses: ./.github/actions/setup-node-pnpm
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}
          github-token: ${{ github.token }}
          registry-url: https://registry.npmjs.org/

      - name: Prepare release version
        id: version
        env:
          CHANNEL: ${{ steps.context.outputs.channel }}
          VERSION: ${{ steps.context.outputs.version }}
          RC_INDEX: ${{ steps.context.outputs.rc_index }}
        run: ./scripts/release-prepare-version.sh

      - name: Build packages and managed artifacts
        run: ./scripts/release-build-packages.sh

      - name: Check publishable package contents
        run: pnpm run packages:check-contents

      - name: Pack npm package release assets
        id: npm-assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release-pack-npm-assets.sh

      - name: Upload workflow npm package assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: midnight-did-npm-packages-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: ${{ steps.npm-assets.outputs.npm_assets_dir }}/*.tgz

      - name: Build ZK artifact bundle
        id: zk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release-build-zk-artifact-bundle.sh

      - name: Check ZK artifact bundle
        env:
          ZK_ARCHIVE: ${{ steps.zk.outputs.zk_archive }}
        run: node scripts/check-zk-artifact-bundle.mjs "$ZK_ARCHIVE"

      - name: Upload workflow ZK artifact bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: midnight-did-zk-artifacts-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            ${{ steps.zk.outputs.zk_archive }}
            ${{ steps.zk.outputs.zk_manifest }}
            ${{ steps.zk.outputs.zk_sha256 }}

      - name: Install Cosign
        if: steps.version.outputs.channel != 'snapshot'
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # ratchet:sigstore/cosign-installer@v3.10.1

      - name: Sign GitHub Release assets
        id: signatures
        if: steps.version.outputs.channel != 'snapshot'
        env:
          NPM_ASSETS_DIR: ${{ steps.npm-assets.outputs.npm_assets_dir }}
          ZK_ARCHIVE: ${{ steps.zk.outputs.zk_archive }}
          ZK_MANIFEST: ${{ steps.zk.outputs.zk_manifest }}
          ZK_SHA256: ${{ steps.zk.outputs.zk_sha256 }}
        run: ./scripts/release-sign-assets.sh

      - name: Upload workflow signature assets
        if: steps.version.outputs.channel != 'snapshot'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: midnight-did-signatures-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: ${{ steps.signatures.outputs.signature_assets_dir }}/*

      - name: Publish npm packages to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_NPMJS_TOKEN }}
          NPM_ACCESS: public
          NPM_ASSETS_DIR: ${{ steps.npm-assets.outputs.npm_assets_dir }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/publish-npm-packages.sh

      - name: Smoke test packages from npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_NPMJS_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release-smoke-npm-packages.sh

      - name: Install ORAS
        run: ./scripts/install-oras.sh

      - name: Publish and verify GHCR ZK artifact
        id: oci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.zk.outputs.zk_archive }}
          ARCHIVE_NAME: ${{ steps.zk.outputs.zk_archive_name }}
          MANIFEST: ${{ steps.zk.outputs.zk_manifest }}
        run: ./scripts/publish-ghcr-zk-artifact.sh

      - name: Build SLSA provenance subject list from release assets
        id: provenance-subjects
        if: steps.version.outputs.channel != 'snapshot'
        env:
          NPM_ASSETS_DIR: ${{ steps.npm-assets.outputs.npm_assets_dir }}
          SIGNATURE_ASSETS_DIR: ${{ steps.signatures.outputs.signature_assets_dir }}
          ZK_ARCHIVE: ${{ steps.zk.outputs.zk_archive }}
          ZK_MANIFEST: ${{ steps.zk.outputs.zk_manifest }}
          ZK_SHA256: ${{ steps.zk.outputs.zk_sha256 }}
        run: ./scripts/release-build-provenance-subjects.sh

      - name: Check existing GitHub Release state
        id: release-state
        if: steps.version.outputs.channel != 'snapshot'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_exists=false
          provenance_present=false
          if release_json="$(gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" --json assets 2>/dev/null)"; then
            release_exists=true
            provenance_present="$(jq -r '[.assets[].name | select(test("\\.intoto\\.jsonl$"))] | length > 0' <<<"${release_json}")"
          fi
          echo "release_exists=${release_exists}" >> "${GITHUB_OUTPUT}"
          echo "provenance_present=${provenance_present}" >> "${GITHUB_OUTPUT}"

      - name: Print publication summary
        env:
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          OCI_REF: ${{ steps.oci.outputs.oci_ref }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: ./scripts/release-print-summary.sh

  github-release-provenance:
    name: Generate GitHub Release SLSA provenance
    needs:
      - publish
    if: needs.publish.result == 'success' && needs.publish.outputs.channel != 'snapshot' && needs.publish.outputs.provenance_present != 'true'
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses] SLSA requires the release tag to resolve its prebuilt generator
    with:
      base64-subjects: ${{ needs.publish.outputs.base64_subjects }}
      upload-assets: false

  finalize-github-release:
    name: Publish GitHub Release with provenance
    needs:
      - publish
      - github-release-provenance
    if: >-
      always() && needs.publish.result == 'success' &&
      needs.publish.outputs.channel != 'snapshot' &&
      (needs.publish.outputs.provenance_present == 'true' || needs.github-release-provenance.result == 'success')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          github-token: ${{ github.token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Download npm package assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # ratchet:actions/download-artifact@v4
        with:
          name: midnight-did-npm-packages-${{ needs.publish.outputs.version }}
          path: dist/release/npm

      - name: Download ZK assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # ratchet:actions/download-artifact@v4
        with:
          name: midnight-did-zk-artifacts-${{ needs.publish.outputs.version }}
          path: dist/release/zk

      - name: Download signature assets
        if: needs.publish.outputs.channel != 'snapshot'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # ratchet:actions/download-artifact@v4
        with:
          name: midnight-did-signatures-${{ needs.publish.outputs.version }}
          path: dist/release/signatures

      - name: Download generated provenance
        if: needs.publish.outputs.provenance_present != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # ratchet:actions/download-artifact@v4
        with:
          name: ${{ needs.github-release-provenance.outputs.provenance-name }}
          path: dist/release/provenance

      - name: Publish and verify GitHub Release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
          PRERELEASE: ${{ needs.publish.outputs.prerelease }}
          VERSION: ${{ needs.publish.outputs.version }}
          GITHUB_SHA: ${{ github.sha }}
          PROVENANCE_PRESENT: ${{ needs.publish.outputs.provenance_present }}
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/publish.yml@refs/heads/${{ github.ref_name }}
          COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          archive="$(find dist/release/zk -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          manifest="$(find dist/release/zk -maxdepth 1 -type f -name '*.json' -print -quit)"
          sha256_file="$(find dist/release/zk -maxdepth 1 -type f -name '*.sha256' -print -quit)"
          provenance_file=""
          if [[ "${PROVENANCE_PRESENT}" != "true" ]]; then
            provenance_file="$(find dist/release/provenance -maxdepth 1 -type f -name '*.intoto.jsonl' -print -quit)"
          fi
          ARCHIVE="${archive}" \
          ARCHIVE_NAME="$(basename "${archive}")" \
          MANIFEST="${manifest}" \
          SHA256="${sha256_file}" \
          NPM_ASSETS_DIR=dist/release/npm \
          SIGNATURE_ASSETS_DIR=dist/release/signatures \
          PROVENANCE_FILE="${provenance_file}" \
          ./scripts/publish-github-release-assets.sh

  verify-github-release-provenance:
    name: Verify GitHub Release provenance asset
    needs:
      - publish
      - github-release-provenance
      - finalize-github-release
    if: always() && needs.publish.result == 'success' && needs.publish.outputs.channel != 'snapshot'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Verify release includes SLSA provenance
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | tee /tmp/release-assets.txt
          if ! grep -Eq '\.intoto\.jsonl$' /tmp/release-assets.txt; then
            echo "::error::GitHub Release ${RELEASE_TAG} does not include a SLSA .intoto.jsonl provenance asset."
            exit 1
          fi
          if ! grep -Eq '\.sig$' /tmp/release-assets.txt; then
            echo "::error::GitHub Release ${RELEASE_TAG} does not include Cosign .sig signature assets."
            exit 1
          fi
