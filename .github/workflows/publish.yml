name: Publish Packages and ZK Artifacts

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      channel:
        description: "Publication channel"
        required: true
        type: choice
        default: rc
        options:
          - snapshot
          - rc
          - release
      version:
        description: "Base semantic version, for example 0.4.0. Defaults to package.json version."
        required: false
        type: string
      rc_index:
        description: "Positive integer used for rc versions, for example 1 creates x.y.z-rc1."
        required: false
        type: string

permissions:
  contents: read

env:
  COMPACT_COMPILER_VERSION: 0.30.0
  ORAS_VERSION: 1.2.3
  PNPM_CONFIG_AUDIT: "false"
  PNPM_CONFIG_FUND: "false"

concurrency:
  group: did-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Classify snapshot release changes
    runs-on: ubuntu-latest
    outputs:
      changed_file_count: ${{ steps.classify.outputs.changed_file_count }}
      snapshot_release_relevant: ${{ steps.classify.outputs.snapshot_release_relevant }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-change-classifier.mjs --output "$GITHUB_OUTPUT"

      - name: Print snapshot release classification
        run: |
          echo "snapshot_release_relevant=${{ steps.classify.outputs.snapshot_release_relevant }}"
          echo "changed_file_count=${{ steps.classify.outputs.changed_file_count }}"

  skip-snapshot:
    name: Skip snapshot publication
    runs-on: ubuntu-latest
    needs:
      - changes
    if: github.event_name == 'push' && (github.ref != 'refs/heads/develop' || needs.changes.outputs.snapshot_release_relevant != 'true')
    steps:
      - name: Report skipped snapshot
        env:
          REF_NAME: ${{ github.ref_name }}
          CHANGED_FILE_COUNT: ${{ needs.changes.outputs.changed_file_count }}
        run: |
          echo "Skipping automated snapshot publication."
          echo "Branch: $REF_NAME"
          echo "Changed files: $CHANGED_FILE_COUNT"
          echo "Snapshot publication is reserved for develop pushes with Compact, TypeScript, JavaScript, or script changes."

  publish:
    name: Publish packages and ZK artifacts
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    needs:
      - changes
    if: github.event_name != 'push' || (github.ref == 'refs/heads/develop' && needs.changes.outputs.snapshot_release_relevant == 'true')
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve publication context
        id: context
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_RC_INDEX: ${{ inputs.rc_index }}
        run: ./scripts/release-resolve-context.sh

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # ratchet:actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Compact toolchain
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # ratchet:midnightntwrk/setup-compact-action@v1
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Verify Compact installation
        run: compact compile --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare release version
        id: version
        env:
          CHANNEL: ${{ steps.context.outputs.channel }}
          VERSION: ${{ steps.context.outputs.version }}
          RC_INDEX: ${{ steps.context.outputs.rc_index }}
        run: ./scripts/release-prepare-version.sh

      - name: Build packages and managed artifacts
        run: ./scripts/release-build-packages.sh

      - name: Check publishable package contents
        run: pnpm run packages:check-contents

      - name: Build ZK artifact bundle
        id: zk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release-build-zk-artifact-bundle.sh

      - name: Check ZK artifact bundle
        run: node scripts/check-zk-artifact-bundle.mjs "${{ steps.zk.outputs.zk_archive }}"

      - name: Upload workflow ZK artifact bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: midnight-did-zk-artifacts-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            ${{ steps.zk.outputs.zk_archive }}
            ${{ steps.zk.outputs.zk_manifest }}
            ${{ steps.zk.outputs.zk_sha256 }}

      - name: Publish npm packages to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/publish-npm-packages.sh

      - name: Smoke test packages from GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_READ }}
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release-smoke-npm-packages.sh

      - name: Install ORAS
        run: ./scripts/install-oras.sh

      - name: Publish and verify GHCR ZK artifact
        id: oci
        env:
          GH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.zk.outputs.zk_archive }}
          ARCHIVE_NAME: ${{ steps.zk.outputs.zk_archive_name }}
          MANIFEST: ${{ steps.zk.outputs.zk_manifest }}
        run: ./scripts/publish-ghcr-zk-artifact.sh

      - name: Publish and verify GitHub Release ZK assets
        if: steps.version.outputs.channel != 'snapshot'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          ARCHIVE: ${{ steps.zk.outputs.zk_archive }}
          ARCHIVE_NAME: ${{ steps.zk.outputs.zk_archive_name }}
          MANIFEST: ${{ steps.zk.outputs.zk_manifest }}
          SHA256: ${{ steps.zk.outputs.zk_sha256 }}
        run: ./scripts/publish-github-release-zk-assets.sh

      - name: Print publication summary
        env:
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          OCI_REF: ${{ steps.oci.outputs.oci_ref }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: ./scripts/release-print-summary.sh
