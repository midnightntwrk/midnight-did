name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: did-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-pipeline:
    name: Build, Lint, Test, and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPACT_COMPILER_VERSION: 0.29.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # ratchet:actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Compact developer tools
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Compact compiler toolchain
        run: |
          if [ -n "${COMPACT_COMPILER_VERSION}" ]; then
            compact update "${COMPACT_COMPILER_VERSION}"
          else
            compact update
          fi

      - name: Verify Compact installation
        run: compact compile --version

      - name: Install dependencies
        run: npm ci

      - name: Ensure Rollup Linux binary is present
        if: runner.os == 'Linux'
        run: |
          # npm sometimes skips optional platform-specific rollup deps; install explicitly on Linux
          npm_config_package_lock=false npm install --no-save @rollup/rollup-linux-x64-gnu@4.50.1

      - name: Run project workflow
        run: bash ./run.sh
