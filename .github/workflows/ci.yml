name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: did-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-pipeline-fast:
    name: Build, Lint, Test (No Coverage)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPACT_COMPILER_VERSION: 0.30.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # ratchet:actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Compact toolchain
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # ratchet:midnightntwrk/setup-compact-action@v1
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Verify Compact installation
        run: compact compile --version

      - name: Run toolchain precheck
        run: npm run check:toolchain

      - name: Install dependencies
        run: npm ci

      - name: Validate workspace boundary
        run: npm run check:workspaces

      - name: Validate Mermaid diagrams
        run: npm run docs:check-mermaid -- --source README.md --source docs

      - name: Validate run.sh contract modes
        run: npm run test:run-sh

      - name: Run project workflow
        run: |
          mkdir -p ci-artifacts/metrics
          bash ./run.sh --skip-coverage --metrics-json ci-artifacts/metrics/ci-metrics.json

      - name: Validate contract coverage thresholds
        run: npm run coverage

      - name: Publish metrics artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: run-metrics-fast
          path: ci-artifacts/metrics/ci-metrics.json

  run-pipeline-full:
    name: Build, Lint, Test, and Coverage
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPACT_COMPILER_VERSION: 0.30.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # ratchet:actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Compact toolchain
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # ratchet:midnightntwrk/setup-compact-action@v1
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Verify Compact installation
        run: compact compile --version

      - name: Run toolchain precheck
        run: npm run check:toolchain

      - name: Install dependencies
        run: npm ci

      - name: Validate workspace boundary
        run: npm run check:workspaces

      - name: Validate Mermaid diagrams
        run: npm run docs:check-mermaid -- --source README.md --source docs

      - name: Validate run.sh contract modes
        run: npm run test:run-sh

      - name: Run project workflow
        run: |
          mkdir -p ci-artifacts/metrics
          bash ./run.sh --strict --metrics-json ci-artifacts/metrics/ci-metrics-strict.json

      - name: Publish metrics artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: run-metrics-full
          path: ci-artifacts/metrics/ci-metrics-strict.json
