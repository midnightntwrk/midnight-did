name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: read
  pull-requests: read

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

concurrency:
  group: did-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (Lint + Contract/Domain/DID/Secret Storage)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPACT_COMPILER_VERSION: 0.30.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # ratchet:actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Compact toolchain
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Verify Compact installation
        run: compact compile --version

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run core workflow
        run: npm run ci:core

  services:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: api
            name: API pipeline
            script: ./run-api.sh
          - id: resolver
            name: Resolver pipeline
            script: ./run-resolver.sh
          - id: manager
            name: DID manager pipeline
            script: ./run-manager.sh
    env:
      COMPACT_COMPILER_VERSION: 0.30.0
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
      # Optional optimization: point this repository variable to a pre-bootstrapped proof-server image
      # (for example ghcr.io/<org>/<image>:<tag>) to reduce cold-start time in Docker-based tests.
      PROOF_SERVER_IMAGE: ${{ vars.PROOF_SERVER_IMAGE != '' && vars.PROOF_SERVER_IMAGE || 'midnightntwrk/proof-server:8.0.3' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # ratchet:actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Compact toolchain
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Verify Compact installation
        run: compact compile --version

      - name: Cache Playwright browsers
        if: matrix.id == 'manager'
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # ratchet:actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Prepare contract package build outputs
        run: npm run build:prepared -w contract

      - name: Run service workflow
        run: bash ${{ matrix.script }}

  run-pipeline:
    name: Build, Lint, Test, and Coverage
    runs-on: ubuntu-latest
    if: always()
    needs:
      - core
      - services
    steps:
      - name: Check dependency jobs
        run: |
          echo "core: ${{ needs.core.result }}"
          echo "services: ${{ needs.services.result }}"

          if [[ "${{ needs.core.result }}" != "success" || "${{ needs.services.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi

          echo "All CI jobs passed."
