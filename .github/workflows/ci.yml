name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: read
  pull-requests: read

env:
  COMPACT_COMPILER_VERSION: 0.30.0
  PNPM_CONFIG_AUDIT: "false"
  PNPM_CONFIG_FUND: "false"
  # Optional optimization: point this repository variable to a pre-bootstrapped proof-server image
  # (for example ghcr.io/<org>/<image>:<tag>) to reduce cold-start time in Docker-based tests.
  PROOF_SERVER_IMAGE: ${{ vars.PROOF_SERVER_IMAGE != '' && vars.PROOF_SERVER_IMAGE || 'midnightntwrk/proof-server:8.0.3' }}

concurrency:
  group: did-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-pipeline:
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    # Stable aggregate context for branch protection. Classification, setup,
    # core, package smoke, and API work are kept as steps to reduce duplicate
    # check contexts and avoid repeated shared setup.
    name: Build, Lint, Test, and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-change-classifier.mjs --output "$GITHUB_OUTPUT"

      - name: Resolve CI scope
        id: scope
        env:
          CHANGED_FILE_COUNT: ${{ steps.classify.outputs.changed_file_count }}
          CODE_CHANGED: ${{ steps.classify.outputs.code_changed }}
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "event_name=${EVENT_NAME}"
          echo "docs_only=${DOCS_ONLY}"
          echo "code_changed=${CODE_CHANGED}"
          echo "changed_file_count=${CHANGED_FILE_COUNT}"

          full_ci_required="false"
          if [[ "${EVENT_NAME}" == "schedule" || "${EVENT_NAME}" == "workflow_dispatch" || "${CODE_CHANGED}" == "true" ]]; then
            full_ci_required="true"
          fi

          echo "full_ci_required=${full_ci_required}" >> "$GITHUB_OUTPUT"

      - name: Report skipped CI implementation
        if: steps.scope.outputs.full_ci_required != 'true'
        run: echo "No code-impacting changes detected; core/API implementation skipped."

      - name: Set up Node.js, pnpm, and Compact
        if: steps.scope.outputs.full_ci_required == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}
          github-token: ${{ github.token }}

      - name: Run core workflow
        if: steps.scope.outputs.full_ci_required == 'true'
        run: ./run.sh core --strict

      - name: Run package smoke tests
        if: steps.scope.outputs.full_ci_required == 'true'
        run: pnpm run packages-smoke-tests

      - name: Run API workflow
        if: steps.scope.outputs.full_ci_required == 'true'
        run: ./run.sh api --strict

      - name: Run test coverage and enforce thresholds
        id: coverage
        if: steps.scope.outputs.full_ci_required == 'true'
        run: pnpm run coverage:all

      - name: Upload coverage reports
        if: always() && steps.coverage.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-coverage-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            packages/api/coverage
            packages/contract/coverage
            packages/did/coverage
            packages/domain/coverage
            packages/jubjub-schnorr/coverage

      - name: Upload coverage to Codecov
        if: steps.coverage.outcome == 'success'
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          use_oidc: true
          files: packages/api/coverage/lcov.info,packages/contract/coverage/lcov.info,packages/did/coverage/lcov.info,packages/domain/coverage/lcov.info,packages/jubjub-schnorr/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
