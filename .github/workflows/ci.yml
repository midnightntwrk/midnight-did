name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: did-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-pipeline:
    name: Build, Lint, Test, and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPACT_VERSION: compact-v0.2.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # ratchet:actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # ratchet:actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/midnightntwrk/compact/releases/download/${COMPACT_VERSION}/compact-installer.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Run project workflow
        run: bash ./run.sh
