name: Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read
  pull-requests: read

env:
  COMPACT_COMPILER_VERSION: 0.31.1
  PNPM_CONFIG_AUDIT: "false"
  PNPM_CONFIG_FUND: "false"

concurrency:
  group: did-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Stable aggregate context for branch protection. Keep this name stable even
    # if future implementation lanes split underneath a reusable workflow.
    name: Typecheck, Audit, and Static Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-change-classifier.mjs --output "$GITHUB_OUTPUT"

      - name: Resolve quality scope
        id: scope
        env:
          CHANGED_FILE_COUNT: ${{ steps.classify.outputs.changed_file_count }}
          CODE_CHANGED: ${{ steps.classify.outputs.code_changed }}
          DOCS_ONLY: ${{ steps.classify.outputs.docs_only }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "event_name=${EVENT_NAME}"
          echo "docs_only=${DOCS_ONLY}"
          echo "code_changed=${CODE_CHANGED}"
          echo "changed_file_count=${CHANGED_FILE_COUNT}"

          full_quality_required="false"
          if [[ "${EVENT_NAME}" == "schedule" || "${EVENT_NAME}" == "workflow_dispatch" || "${CODE_CHANGED}" == "true" ]]; then
            full_quality_required="true"
          fi

          echo "full_quality_required=${full_quality_required}" >> "$GITHUB_OUTPUT"

      - name: Report skipped quality implementation
        if: steps.scope.outputs.full_quality_required != 'true'
        run: echo "No code-impacting changes detected; Compact/typecheck/static quality implementation skipped."

      - name: Set up Node.js, pnpm, and Compact
        if: steps.scope.outputs.full_quality_required == 'true'
        uses: ./.github/actions/setup-node-pnpm
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}
          github-token: ${{ github.token }}

      - name: Build typecheck prerequisites
        if: steps.scope.outputs.full_quality_required == 'true'
        run: pnpm run build:all

      - name: Typecheck all workspaces
        if: steps.scope.outputs.full_quality_required == 'true'
        run: |
          pnpm --filter ./packages/jubjub-schnorr typecheck
          pnpm --filter ./packages/contract typecheck
          pnpm --filter ./packages/domain typecheck
          pnpm --filter ./packages/did typecheck
          pnpm --filter ./packages/api typecheck

      - name: Run static contract checks
        if: steps.scope.outputs.full_quality_required == 'true'
        run: |
          pnpm run check:workspace-manifests
          pnpm run check:did-surface-discipline
          pnpm run check:source-imports
          pnpm run check:engine-agnostic-imports
          pnpm run check:run-target-catalog
