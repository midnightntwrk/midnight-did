name: Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read

env:
  COMPACT_COMPILER_VERSION: 0.30.0
  PNPM_CONFIG_AUDIT: "false"
  PNPM_CONFIG_FUND: "false"

concurrency:
  group: did-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, Audit, and Static Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # ratchet:actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Compact toolchain
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # ratchet:midnightntwrk/setup-compact-action@v1
        with:
          compact-version: ${{ env.COMPACT_COMPILER_VERSION }}

      - name: Verify Compact installation
        run: compact compile --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build typecheck prerequisites
        run: pnpm run build:all

      - name: Typecheck all workspaces
        run: |
          pnpm --filter ./packages/jubjub-schnorr typecheck
          pnpm --filter ./packages/contract typecheck
          pnpm --filter ./packages/domain typecheck
          pnpm --filter ./packages/did typecheck
          pnpm --filter ./packages/api typecheck

      - name: Run static contract checks
        run: |
          pnpm run check:workspace-manifests
          pnpm run check:did-surface-discipline
          pnpm run check:source-imports
          pnpm run check:engine-agnostic-imports
          pnpm run check:run-target-catalog
