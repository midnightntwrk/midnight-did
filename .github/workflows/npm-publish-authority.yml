name: Verify npm Publication Authority

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dispatch-ref:
    name: Reject untrusted dispatch ref
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch ref
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "${DISPATCH_REF}" != "refs/heads/main" || "${DISPATCH_REF_TYPE}" != "branch" ]]; then
            echo "::error::npm authority verification may only be dispatched from refs/heads/main."
            exit 1
          fi

  verify-authority:
    name: Verify read-only npm authority
    needs:
      - validate-dispatch-ref
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_type == 'branch'
    permissions:
      contents: read
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Revalidate trusted dispatch context
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "${DISPATCH_REF}" != "refs/heads/main" || "${DISPATCH_REF_TYPE}" != "branch" ]]; then
            echo "::error::Refusing npm authority verification outside refs/heads/main."
            exit 1
          fi

      - name: Checkout immutable dispatch commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify npm identity and package authority
        env:
          NPMJS_RELEASE_TOKEN: ${{ secrets.NPMJS_RELEASE_TOKEN }}
        run: node scripts/check-npm-publish-authority.mjs
