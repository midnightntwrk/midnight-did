services:
  proof-server:
    image: "${PROOF_SERVER_IMAGE:-midnightntwrk/proof-server:8.0.3}"
    command: ["midnight-proof-server -v"]
    ports:
      - "0:6300"
    environment:
      RUST_BACKTRACE: "full"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6300/version"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  indexer:
    image: "midnightntwrk/indexer-standalone:4.0.0"
    env_file: ../api/standalone.env.example
    ports:
      - "0:8088"
    environment:
      RUST_LOG: "indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info"
      APP__APPLICATION__NETWORK_ID: "undeployed"
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: "midnightntwrk/midnight-node:0.22.3"
    ports:
      - "0:9944"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s
    environment:
      CFG_PRESET: "dev"
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"

  did-resolver:
    build:
      context: ..
      dockerfile: did-resolver-service/Dockerfile
    environment:
      RESOLVER_HOST: "0.0.0.0"
      RESOLVER_PORT: "3001"
      MIDNIGHT_INDEXER_HTTP_URL: "http://indexer:8088/api/v3/graphql"
      MIDNIGHT_INDEXER_WS_URL: "ws://indexer:8088/api/v3/graphql/ws"
    ports:
      - "0:3001"
    depends_on:
      indexer:
        condition: service_healthy
