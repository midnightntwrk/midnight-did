<svg width="1400" height="520" viewBox="0 0 1400 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="520" rx="28" fill="#071121"/>
  <rect x="18" y="18" width="1364" height="484" rx="24" fill="url(#bg)" stroke="#28436D" stroke-width="2"/>
  <text x="60" y="86" fill="#F4F8FF" font-size="44" font-family="Verdana, sans-serif" font-weight="700">Midnight Credentials Cast</text>
  <text x="60" y="122" fill="#9DB5D8" font-size="20" font-family="Verdana, sans-serif">Five people, one privacy problem, and one engineer with a permanent eyebrow raise.</text>

  <g transform="translate(54 160)">
    <g transform="translate(0 0)">
      <rect width="240" height="286" rx="20" fill="#0B172A" stroke="#355B90" stroke-width="2"/>
      <circle cx="120" cy="88" r="46" fill="#FFDFC4"/>
      <path d="M76 82C82 42 158 42 164 82" fill="#10192A"/>
      <circle cx="103" cy="92" r="4" fill="#0B172A"/>
      <circle cx="137" cy="92" r="4" fill="#0B172A"/>
      <path d="M103 117C113 125 127 125 137 117" stroke="#9B4A4A" stroke-width="4" stroke-linecap="round"/>
      <rect x="72" y="136" width="96" height="84" rx="24" fill="#548BE6"/>
      <text x="24" y="248" fill="#F5F8FF" font-size="30" font-family="Verdana, sans-serif" font-weight="700">Alice</text>
      <text x="24" y="274" fill="#A5BCE0" font-size="16" font-family="Verdana, sans-serif">Holder</text>
      <text x="24" y="298" fill="#A5BCE0" font-size="14" font-family="Verdana, sans-serif">Wants privacy, usable UX,</text>
      <text x="24" y="318" fill="#A5BCE0" font-size="14" font-family="Verdana, sans-serif">and fewer suspicious logs.</text>
    </g>

    <g transform="translate(264 0)">
      <rect width="240" height="286" rx="20" fill="#0B172A" stroke="#355B90" stroke-width="2"/>
      <circle cx="120" cy="88" r="46" fill="#E5C7B0"/>
      <path d="M80 82C94 28 150 38 162 82" fill="#5B3C26"/>
      <circle cx="103" cy="92" r="4" fill="#0B172A"/>
      <circle cx="137" cy="92" r="4" fill="#0B172A"/>
      <path d="M101 119C112 112 128 112 139 119" stroke="#9B4A4A" stroke-width="4" stroke-linecap="round"/>
      <rect x="72" y="136" width="96" height="84" rx="24" fill="#7AAE63"/>
      <text x="24" y="248" fill="#F5F8FF" font-size="30" font-family="Verdana, sans-serif" font-weight="700">Bob</text>
      <text x="24" y="274" fill="#A5BCE0" font-size="16" font-family="Verdana, sans-serif">Counter-example</text>
      <text x="24" y="298" fill="#A5BCE0" font-size="14" font-family="Verdana, sans-serif">Not evil. Just useful when</text>
      <text x="24" y="318" fill="#A5BCE0" font-size="14" font-family="Verdana, sans-serif">a test needs to fail honestly.</text>
    </g>

    <g transform="translate(528 0)">
      <rect width="240" height="286" rx="20" fill="#0B172A" stroke="#355B90" stroke-width="2"/>
      <circle cx="120" cy="88" r="46" fill="#F6D0B3"/>
      <path d="M76 84C86 30 156 30 166 84" fill="#563B2E"/>
      <circle cx="103" cy="92" r="4" fill="#0B172A"/>
      <circle cx="137" cy="92" r="4" fill="#0B172A"/>
      <path d="M104 119C113 123 127 123 136 119" stroke="#9B4A4A" stroke-width="4" stroke-linecap="round"/>
      <rect x="72" y="136" width="96" height="84" rx="24" fill="#D68C4D"/>
      <text x="24" y="248" fill="#F5F8FF" font-size="30" font-family="Verdana, sans-serif" font-weight="700">Rita</text>
      <text x="24" y="274" fill="#A5BCE0" font-size="16" font-family="Verdana, sans-serif">Issuer</text>
      <text x="24" y="298" fill="#A5BCE0" font-size="14" font-family="Verdana, sans-serif">Attests source facts and</text>
      <text x="24" y="318" fill="#A5BCE0" font-size="14" font-family="Verdana, sans-serif">dislikes semantic nonsense.</text>
    </g>

    <g transform="translate(792 0)">
      <rect width="240" height="286" rx="20" fill="#0B172A" stroke="#355B90" stroke-width="2"/>
      <circle cx="120" cy="88" r="46" fill="#F1D1B7"/>
      <path d="M74 84C84 42 156 36 166 84" fill="#273142"/>
      <circle cx="103" cy="92" r="4" fill="#0B172A"/>
      <circle cx="137" cy="92" r="4" fill="#0B172A"/>
      <path d="M102 120C113 113 127 113 138 120" stroke="#9B4A4A" stroke-width="4" stroke-linecap="round"/>
      <rect x="72" y="136" width="96" height="84" rx="24" fill="#6C80EA"/>
      <rect x="166" y="46" width="34" height="44" rx="8" fill="#DDE7F8" stroke="#355B90" stroke-width="2"/>
      <line x1="174" y1="60" x2="192" y2="60" stroke="#355B90" stroke-width="2"/>
      <line x1="174" y1="70" x2="192" y2="70" stroke="#355B90" stroke-width="2"/>
      <line x1="174" y1="80" x2="192" y2="80" stroke="#355B90" stroke-width="2"/>
      <text x="24" y="248" fill="#F5F8FF" font-size="30" font-family="Verdana, sans-serif" font-weight="700">Vera</text>
      <text x="24" y="274" fill="#A5BCE0" font-size="16" font-family="Verdana, sans-serif">Verifier</text>
      <text x="24" y="298" fill="#A5BCE0" font-size="14" font-family="Verdana, sans-serif">Arrives with a request,</text>
      <text x="24" y="318" fill="#A5BCE0" font-size="14" font-family="Verdana, sans-serif">a challenge, and a clipboard.</text>
    </g>

    <g transform="translate(1056 0)">
      <rect width="240" height="286" rx="20" fill="#0B172A" stroke="#355B90" stroke-width="2"/>
      <circle cx="120" cy="88" r="46" fill="#E6C5A6"/>
      <path d="M62 92C68 44 118 20 138 26C161 32 180 54 178 92" fill="#0F2039"/>
      <path d="M93 42L117 18L143 42" stroke="#5FA8FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="103" cy="94" r="4" fill="#0B172A"/>
      <circle cx="137" cy="94" r="4" fill="#0B172A"/>
      <path d="M100 121C112 116 128 116 140 121" stroke="#9B4A4A" stroke-width="4" stroke-linecap="round"/>
      <rect x="72" y="136" width="96" height="84" rx="24" fill="#3B5EA6"/>
      <text x="24" y="248" fill="#F5F8FF" font-size="30" font-family="Verdana, sans-serif" font-weight="700">Mohawk</text>
      <text x="24" y="274" fill="#A5BCE0" font-size="16" font-family="Verdana, sans-serif">Engineer</text>
      <text x="24" y="298" fill="#A5BCE0" font-size="14" font-family="Verdana, sans-serif">Finds the privacy leak</text>
      <text x="24" y="318" fill="#A5BCE0" font-size="14" font-family="Verdana, sans-serif">before the leak finds prod.</text>
    </g>
  </g>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1830"/>
      <stop offset="1" stop-color="#09101F"/>
    </linearGradient>
  </defs>
</svg>
