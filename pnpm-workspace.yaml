packages:
  - packages/api
  - packages/domain
  - packages/did
  - packages/jubjub-schnorr
  - packages/contract
  - docs-site

blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  # Renovate security update: brace-expansion@5.0.8
  - brace-expansion@5.0.8
  # Renovate security update: mermaid@11.16.1
  - mermaid@11.16.1
trustPolicyExclude:
  # mermaid@11.16.0 pulls @antfu/install-pkg via @iconify/utils, which resolves
  # tinyexec@1.2.2. pnpm flags the package's attestation-only publication as a
  # trust-policy downgrade from earlier trusted-publisher evidence.
  - tinyexec@1.2.2
  # pino@9.14.0 is already locked at the registry's signed sha512 integrity and
  # matches the GitHub v9.14.0 tag at its verified, maintainer-authored commit.
  # Unlike pino@9.13.1, its registry metadata lacks a provenance attestation,
  # so pnpm rejects it when unrelated lockfile entries are refreshed.
  - pino@9.14.0
