services:
  proof-server:
    container_name: "did-proof-server"
    image: "${PROOF_SERVER_IMAGE:-midnightntwrk/proof-server:9.0.1}"
    command: ["midnight-proof-server -v"]
    ports:
      - "6300"
    environment:
      RUST_BACKTRACE: "full"
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/6300 || exit 1
          printf 'GET /version HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          IFS= read -r -t 3 status <&3 || exit 1
          [[ "$$status" == "HTTP/1.1 200 "* || "$$status" == "HTTP/1.0 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  indexer:
    container_name: "did-indexer"
    image: "midnightntwrk/indexer-standalone:4.4.101"
    env_file: standalone.env.example
    ports:
      - "0:8088"
    environment:
      RUST_LOG: "indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info"
      APP__APPLICATION__NETWORK_ID: "undeployed"
      # Official indexer-standalone compose points SPO at the same node.
      APP__INFRA__SPO_NODE__URL: "ws://node:9944"
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: "midnightntwrk/midnight-node:2.1.101"
    container_name: "did-node"
    ports:
      - "9944"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          curl -sf http://localhost:9944/health >/dev/null &&
          curl -sf -H 'Content-Type: application/json' -d '{"id":1,"jsonrpc":"2.0","method":"chain_getHeader","params":[]}' http://localhost:9944 |
          grep -Eq '"number":"0x0*[1-9a-f][0-9a-f]*"'
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 20s
    environment:
      CFG_PRESET: "dev"
      SIDECHAIN_BLOCK_BENEFICIARY: "04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e"
